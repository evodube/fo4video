; fo4video settings. Key codes are Windows virtual-key codes (0x78 = F9, 0x79 = F10, ...). 0 disables a key.

[General]
; Test hotkeys. Open the console, click a TV, close the console, then press a key.
bEnableHotkeys=1
iKeyPlayNext=0x78       ; F9  - play the next video from sVideoFolder on the selected TV
iKeyTestPattern=0x79    ; F10 - animated test pattern on the selected TV (no video decoding involved)
iKeyStop=0x7A           ; F11 - stop the selected TV (or every TV if none selected/playing)
iKeyDumpNodes=0x77      ; F8  - write the selected object's meshes/textures to fo4video.log

; Folder with your videos, relative to the Fallout 4 folder (MO2's virtual Data folder works).
sVideoFolder=Data\Videos
bLoop=1
; Pause video and sound while the Pip-Boy / menus / console are open.
bPauseInMenus=0
; How many screens can play at once (1-16).
iMaxScreens=8

[Screen]
; Mesh names that count as a screen (case-insensitive, partial match).
sScreenNames=screen,display,monitor,crt,tube
; Exact name of the mesh to use, if the automatic pick is wrong (find it with the dump key).
sForceNode=
; -1 = match the screen's original texture, 0 = linear, 1 = sRGB. Try 0/1 if colors look washed out or too dark.
iSRGB=-1
; Reset the screen's texture scrolling/scaling so the whole video fills it.
bResetUV=1
; Brightness multiplier for glowing (effect shader) screens.
fBrightness=1.0
; Leave empty. Advanced: path prefix used to load Textures\fo4video\slotNN.dds.
sPlaceholderPrefix=

[Audio]
bEnableAudio=1
fVolume=1.0
; Full volume within fMinDistance, silent beyond fMaxDistance (game units; ~70 units = 1 m).
fMinDistance=150
fMaxDistance=1500
