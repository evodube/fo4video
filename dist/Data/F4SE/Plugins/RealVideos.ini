; Real Videos settings. Key codes are Windows virtual-key codes (0x76 = F7, 0x77 = F8, 0x78 = F9 ...). 0 disables a key.

[General]
; Hotkeys. Open the console, click a screen, close the console, then press a key.
bEnableHotkeys=1
iKeyPlayNext=0x78       ; F9  - play the next video from sVideoFolder on the selected screen
iKeyTestPattern=0x79    ; F10 - animated test pattern (red square = top-left, blue = bottom-right)
iKeyStop=0x7A           ; F11 - stop the selected screen (or every screen if none selected/playing)
iKeyDumpNodes=0x77      ; F8  - write the selected object's meshes to RealVideos.log
iKeyNextMesh=0x76       ; F7       - move the video to the next mesh of the selected object
                        ; Shift+F7 - turn / flip / mirror the picture (8 steps)
                        ; Ctrl+Shift+F7 - show it on the other side of a two-sided screen
                        ; Ctrl+F7  - move the video to the next screen of a nearby object (projector -> its screen)
                        ; All three are remembered per object type in RealVideos_Screens.ini.

; Folder with your videos, relative to the Fallout 4 folder (MO2's virtual Data folder works).
sVideoFolder=Data\Videos
bLoop=1
; Pause video and sound in the Esc menu, Pip-Boy, console, loading screens and other pausing menus.
bPauseInMenus=1
; Also pause while the game window isn't in focus (alt-tab).
bPauseWhenAltTabbed=1
; How many screens can play at once (1-16).
iMaxScreens=8
; Hotkeys and the remote work on the TV / projector / cinema screen under your crosshair (no console needed).
; If you aren't aiming at one, the screen clicked in the console is used. fAimDistance = how far you can aim.
bAimToSelect=1
fAimDistance=15000
; F6 - open/close the remote (needs F4SE Menu Framework) for the screen you're aiming at:
;   rewind / play-pause / fast forward (10 s), up/down = volume, left/right = previous/next video,
;   middle = mute, power = off/on, home = first video, search (or the name bar) = scrollable video list.
;   The half circle (left of the top row) sets how see-through the remote is (100% to 40%).
;   Unlocked, drag its bottom-right corner to make it bigger or smaller.
;   Esc or F6 closes it. Pressing W/A/S/D hides the cursor so you can walk and look around with the remote still
;   on screen; Left Alt or F6 brings the cursor back. The padlock (top left) unlocks it so you
;   can drag it by any empty spot; its place is remembered. 0 disables.
iKeyRemote=0x75
; F9/F10 only work on TVs, Videos of the Wasteland projectors/screens and the drive-in cinema (screen or projector).
; 0 = allow any object.
bOnlySupportedScreens=1

[Screen]
; Mesh names that count as a screen (case-insensitive, partial match).
sScreenNames=screen,display,monitor,crt
; Exact mesh name to always use (normally leave empty and use F7 instead).
sForceNode=
; -1 = match the screen's original texture, 0 = linear, 1 = sRGB. Try 0/1 if colors look washed out or too dark.
iSRGB=-1
; Stretch the video over exactly the part of the texture the screen mesh uses (fixes zoomed-in video).
bFitVideoToScreen=1
; Stop the screen's own texture animation while a video plays (Videos of the Wasteland flipbooks).
bStopScreenAnimation=1
; 0 = stretch the video to fill the screen, 1 = keep the video's shape with black bars.
iAspectMode=1
; Big screens (the drive-in cinema, see fBigScreenSize under [Audio]) always stretch the video to fill the screen.
; 0 = follow iAspectMode like every other screen.
bStretchOnBigScreens=1
; Big screens (the drive-in only): picture brightness (1.0 = as is, 1.15 = 15% brighter, up to 4.0).
fBigScreenBrightness=1.15
; Big screens: old VHS tape look (soft picture, colour bleed, washed-out colours, faint scanlines).
; 0 = off, 0.5 = subtle (default), 1 = strong.
fBigScreenVHS=0.5
; When a screen shares one texture with its frame/stand (VotW Radiation Star screen), draw the video only
; inside the flat screen face and keep the frame's own look. 0 = cover the whole mesh like before.
bOnlyInsideScreenArea=1
; Two-sided screens (projector screens) show the video only on the side facing you when it starts.
bShowOnBothSides=0
; Hide layers drawn over the screen while a video plays (the drive-in movie's stills when the projector is on).
; The projector's light beam and sound stay.
bHideOverlays=1
; TVs (glowing screens like the vanilla ScreenAnim): play the whole video over the screen exactly like
; version 0.1 - no screen-area detection, no black bars, the TV's glass/static layers stay. 0 = treat TVs
; like projector screens.
bClassicTVScreens=1
; Projectors (objects with no screen of their own) play on the best screen within this distance,
; and Ctrl+F7 cycles through screens this close. 0 = off.
fNearbyObjectRadius=15000
; Projector and cinema screens glow like TVs: the picture has the same brightness day and night, whichever way the screen
; faces (otherwise the game lights them like a wall: dark at night or when facing away from the moon).
; 0 = lit by the world like before.
bSelfLitScreens=1
; Each screen can be made darker on its own with the remote (sun button, top right). The cinema uses fBigScreenBrightness.
; Draw glowing screens after the rest of the world, so the structure behind a screen (the drive-in's catwalk) can't show
; through the picture. 0 = the old way.
bSelfLitLatePass=1
; Glowing projector screens: the parts that aren't the picture (back of the screen, frame, pole) follow the game's own
; light (weather, time of day, the room's lighting indoors). fFrameLight: 1.0 = normal; higher = brighter, up to 4.0.
fFrameLight=1.0
; Test: projectors keep the game's lighting (frame reacts to light like the speakers) and only the picture glows, using
; the game's glow-map feature. 0 = the glowing shader with fFrameLight above.
bGlowMap=0
; Brightness multiplier for glowing (effect shader) screens.
fBrightness=1.0
; Leave empty. Advanced: path prefix used to load Textures\RealVideos\slotNN.dds.
sPlaceholderPrefix=

[Audio]
; How far away you can hear a screen: full volume up to the first distance, quieter as you walk away, silent past the second.
bEnableAudio=1
fVolume=1.0
; Volume every screen starts at (the remote's middle button shows it; up/down changes it): 0.5 = 50%.
fStartVolume=0.5
; Full volume within fMinDistance, silent beyond fMaxDistance (game units; ~70 units = 1 m).
fMinDistance=150
fMaxDistance=1500
; How the sound fades between the two: 1 = evenly, 2 = smooth fade (default), 3-4 = drops off quicker.
fFalloffCurve=2.0

; Big screens (the drive-in cinema) can be heard much further away. A screen counts as big when its mesh is at
; least fBigScreenSize units across from its centre (the drive-in screen is ~1100; TVs and VotW projectors are
; far smaller). Distances are measured from the screen itself.
fBigScreenSize=500
; Full volume within this distance (~20 m)...
fBigScreenMinDistance=1500
; ...fading out to silence here (~170 m). Raise it to hear the cinema from further away.
fBigScreenMaxDistance=12000
