; Real Videos settings.

[General]
; The remote's key (also changeable on the Settings page). Windows virtual-key code: 0x75 = F6. 0 disables it.
; Everything else - play, next, stop, fixing a screen that's upside down or on the wrong mesh - is on the remote and
; on the "Now playing" page (Fix this screen).
bEnableHotkeys=1

; Folder with your videos, relative to the Fallout 4 folder (MO2's virtual Data folder works). Subfolders work as
; playlists: the remote's list shows them, and next / previous / home stay inside the folder of the video playing.
; Videos in the Autoplay playlist (Data\Videos\Playlists\Autoplay, or a folder inside it) aren't remembered: when a screen playing
; one has turned off because you walked away (or after loading a save), coming back starts a different random video from
; that same folder from the beginning.
sVideoFolder=Data\Videos
; Loop: 1 = a video starts again when it ends. 0 = the next video in its folder plays (after the last one, the first again).
bLoop=1
; Shuffle: random videos, only from the folder (playlist) the screen plays from - folders never mix. Next and turning a
; screen on pick a random one (on: from the folder it last played from), and when a video ends another random one
; starts (bLoop then doesn't repeat the same one). Previous goes back to the video played before. 0 = in order.
bShuffle=0
; Pause video and sound in the Esc menu, Pip-Boy, console, loading screens and other pausing menus.
bPauseInMenus=1
; Also pause while the game window isn't in focus (alt-tab).
bPauseWhenAltTabbed=1
; How many screens can play at once (1-20).
iMaxScreens=10
; Show "playing ... / ... off" messages at the top left (problems always show). 0 = off.
bShowMessages=1
; How far around you "All screens here" (the remote's ALL button) reaches, in game units (70 = 1 m).
fAllScreensRadius=10500
; TVs and projectors you walk away from turn off (freeing memory and their place among the screens playing at once) once you've
; been further than fAutoOffDistance (game units, 70 = 1 m) for fAutoOffSeconds. They remember the video and where it
; was, and carry on from there when you come back. 0 = off.
bAutoOff=1
fAutoOffDistance=7000
fAutoOffSeconds=30
; Pause the video (picture and sound) of screens further than fFreezeDistance or not in front of you for fFreezeSeconds.
; It carries on from the same spot when you look at it or come closer. 0 = off.
bFreezePicture=1
fFreezeDistance=3500
fFreezeSeconds=10
; Videos taller than this are scaled down while decoding, per kind of screen (0 = full size).
iMaxHeightTV=480
iMaxHeightProjector=1080
iMaxHeightCinema=1080
; Decode videos on the graphics card instead of the CPU (falls back to the CPU if it can't). 0 = off.
bGpuDecoding=1
; The remote works on the TV / projector / cinema screen under your crosshair (no console needed).
; If you aren't aiming at one, the screen clicked in the console is used. fAimDistance = how far you can aim.
bAimToSelect=1
fAimDistance=14000
; F6 - open/close the remote (needs F4SE Menu Framework) for the screen you're aiming at:
;   rewind / play-pause / fast forward (10 s), up/down = volume, left/right = previous/next video,
;   middle = mute, power = off/on, home = first video, search (or the name bar) = scrollable video list.
;   The sun (right of the top row) sets this screen's brightness.
;   Unlocked, drag its bottom-right corner to make it bigger or smaller.
;   Esc or F6 closes it. Pressing W/A/S/D hides the cursor so you can walk and look around with the remote still
;   on screen; Left Alt or F6 brings the cursor back. The padlock (top left) unlocks it so you
;   can drag it by any empty spot; its place is remembered. 0 disables.
iKeyRemote=0x75
; The remote only works on TVs, Videos of the Wasteland projectors/screens and the drive-in cinema.
; 0 = allow any object.
bOnlySupportedScreens=1

[Screen]
; Mesh names that count as a screen (case-insensitive, partial match).
sScreenNames=screen,display,monitor,crt
; Exact mesh name to always use (normally leave empty and use Fix this screen > Next mesh instead).
sForceNode=
; -1 = match the screen's original texture, 0 = linear, 1 = sRGB. Try 0/1 if colors look washed out or too dark.
iSRGB=-1
; Stretch the video over exactly the part of the texture the screen mesh uses (fixes zoomed-in video).
bFitVideoToScreen=1
; Stop the screen's own texture animation while a video plays (Videos of the Wasteland flipbooks).
bStopScreenAnimation=1
; 0 = stretch the video to fill the screen, 1 = keep the video's shape with black bars.
iAspectMode=1
; Big screens (the drive-in cinema, see fBigScreenSize under [Audio]) always stretch the video to fill the screen.
; Sound comes from the screen's direction (a screen on your left is louder on the left). 0 = the same in both ears.
bDirectionalSound=1
; 0 = follow iAspectMode like every other screen.
bStretchOnBigScreens=1
; Big screens (the drive-in only): picture brightness (1.0 = as is, 1.15 = 15% brighter, up to 4.0).
fBigScreenBrightness=1.15
; Projectors: stretch the video to fill the screen (no black bars). 0 = keep the video's shape.
bStretchOnProjectors=0
; When a screen shares one texture with its frame/stand (VotW Radiation Star screen), draw the video only
; inside the flat screen face and keep the frame's own look. 0 = cover the whole mesh like before.
bOnlyInsideScreenArea=1
; Two-sided screens (projector screens) show the video only on the side facing you when it starts.
bShowOnBothSides=0
; Hide layers drawn over the screen while a video plays (the drive-in movie's stills when the projector is on).
; The projector's light beam and sound stay.
bHideOverlays=1
; TVs (glowing screens like the vanilla ScreenAnim): play the whole video over the screen exactly like
; version 0.1 - no screen-area detection, no black bars, the TV's glass/static layers stay. 0 = treat TVs
; like projector screens.
bClassicTVScreens=1
; Projectors (objects with no screen of their own) play on the best screen within this distance,
; and Fix this screen > Nearby screen cycles through screens this close. 0 = off.
fNearbyObjectRadius=15000
; Projector and cinema pictures glow like TVs: the same brightness day and night, whichever way the screen faces
; (otherwise the game lights them like a wall: dark at night or when facing away from the moon). 0 = lit by the world.
bSelfLitScreens=1
; Projectors: the frame, back and pole keep the game's lighting and react to light like anything else; only the picture
; glows. 0 = the whole screen glows.
bFrameLitByWorld=1
; Each screen can be made darker on its own with the remote (sun button, top right). The cinema uses fBigScreenBrightness.
; Draw glowing screens after the rest of the world, so the structure behind a screen (the drive-in's catwalk) can't show
; through the picture. 0 = the old way.
bSelfLitLatePass=1
; Brightness multiplier for glowing (effect shader) screens.
fBrightness=1.0
; Leave empty. Advanced: path prefix used to load Textures\RealVideos\slotNN.dds.
sPlaceholderPrefix=

[Audio]
; How far away you can hear a screen: full volume up to the first distance, quieter as you walk away, silent past the second.
bEnableAudio=1
fVolume=1.0
; Volume every screen starts at (the remote's middle button shows it; up/down changes it): 0.5 = 50%.
fStartVolume=0.5
; Full volume within fMinDistance, silent beyond fMaxDistance (game units; ~70 units = 1 m).
fMinDistance=150
fMaxDistance=1500
; How the sound fades between the two: 1 = evenly, 2 = smooth fade (default), 3-4 = drops off quicker.
fFalloffCurve=2.0

; Big screens (the drive-in cinema) can be heard much further away. A screen counts as big when its mesh is at
; least fBigScreenSize units across from its centre (the drive-in screen is ~1100; TVs and VotW projectors are
; far smaller). Distances are measured from the screen itself.
fBigScreenSize=500
; Full volume within this distance (~20 m)...
fBigScreenMinDistance=1500
; ...fading out to silence here (~170 m). Raise it to hear the cinema from further away.
fBigScreenMaxDistance=12000

[Cinema]
; The drive-in cinema has its own pause / turn-off distances (game units, 70 = 1 m; times in seconds).
; Pause: picture and sound pause while it's further than fPauseDistance or not in front of you for fPauseSeconds.
bPause=1
fPauseDistance=10500
fPauseSeconds=10
; Turn off: frees it after you've been further than fTurnOffDistance for fTurnOffSeconds; it remembers the film and
; where it was, and carries on from there when you come back.
bTurnOff=1
fTurnOffDistance=21000
fTurnOffSeconds=30

[CinemaFilm]
; Old cinema film look on the drive-in screen, each part 0.0 (off) to 1.0.
fGrain=0.25
fScratches=0.25
fFlicker=0.2
fVignette=0.35
fSepia=0.3
fWeave=0.15
fSoftness=0.2

[ProjectorFilm]
; Old film look on projector screens (all 0 = off). TVs never get it.
fGrain=0
fScratches=0
fFlicker=0
fVignette=0
fSepia=0
fWeave=0
fSoftness=0
