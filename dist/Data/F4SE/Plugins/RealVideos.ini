; Real Videos settings. Key codes are Windows virtual-key codes (0x76 = F7, 0x77 = F8, 0x78 = F9 ...). 0 disables a key.

[General]
; Hotkeys. Open the console, click a screen, close the console, then press a key.
bEnableHotkeys=1
iKeyPlayNext=0x78       ; F9  - play the next video from sVideoFolder on the selected screen
iKeyTestPattern=0x79    ; F10 - animated test pattern (red square = top-left, blue = bottom-right)
iKeyStop=0x7A           ; F11 - stop the selected screen (or every screen if none selected/playing)
iKeyDumpNodes=0x77      ; F8  - write the selected object's meshes to RealVideos.log
iKeyNextMesh=0x76       ; F7       - move the video to the next mesh of the selected object
                        ; Shift+F7 - turn / flip / mirror the picture (8 steps)
                        ; Ctrl+Shift+F7 - show it on the other side of a two-sided screen
                        ; Ctrl+F7  - move the video to the next screen of a nearby object (projector -> its screen)
                        ; All three are remembered per object type in RealVideos_Screens.ini.

; Folder with your videos, relative to the Fallout 4 folder (MO2's virtual Data folder works).
sVideoFolder=Data\Videos
bLoop=1
; Pause video and sound in the Esc menu, Pip-Boy, console, loading screens and other pausing menus.
bPauseInMenus=1
; Also pause while the game window isn't in focus (alt-tab).
bPauseWhenAltTabbed=1
; How many screens can play at once (1-16).
iMaxScreens=8

[Screen]
; Mesh names that count as a screen (case-insensitive, partial match).
sScreenNames=screen,display,monitor,crt
; Exact mesh name to always use (normally leave empty and use F7 instead).
sForceNode=
; -1 = match the screen's original texture, 0 = linear, 1 = sRGB. Try 0/1 if colors look washed out or too dark.
iSRGB=-1
; Stretch the video over exactly the part of the texture the screen mesh uses (fixes zoomed-in video).
bFitVideoToScreen=1
; Stop the screen's own texture animation while a video plays (Videos of the Wasteland flipbooks).
bStopScreenAnimation=1
; 0 = stretch the video to fill the screen, 1 = keep the video's shape with black bars.
iAspectMode=1
; When a screen shares one texture with its frame/stand (VotW Radiation Star screen), draw the video only
; inside the flat screen face and keep the frame's own look. 0 = cover the whole mesh like before.
bOnlyInsideScreenArea=1
; Two-sided screens (projector screens) show the video only on the side facing you when it starts.
bShowOnBothSides=0
; Hide layers drawn over the screen while a video plays (the drive-in movie's stills when the projector is on).
; The projector's light beam and sound stay.
bHideOverlays=1
; TVs (glowing screens like the vanilla ScreenAnim): play the whole video over the screen exactly like
; version 0.1 - no screen-area detection, no black bars, the TV's glass/static layers stay. 0 = treat TVs
; like projector screens.
bClassicTVScreens=1
; Projectors (objects with no screen of their own) play on the best screen within this distance,
; and Ctrl+F7 cycles through screens this close. 0 = off.
fNearbyObjectRadius=15000
; Brightness multiplier for glowing (effect shader) screens.
fBrightness=1.0
; Leave empty. Advanced: path prefix used to load Textures\RealVideos\slotNN.dds.
sPlaceholderPrefix=

[Audio]
bEnableAudio=1
fVolume=1.0
; Full volume within fMinDistance, silent beyond fMaxDistance (game units; ~70 units = 1 m).
fMinDistance=150
fMaxDistance=1500
